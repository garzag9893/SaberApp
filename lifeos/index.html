<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#14121c" />
    <title>LifeOS</title>
    <script>
      // Aplica el tema guardado antes de pintar la página, para evitar un destello oscuro.
      try {
        var t = (JSON.parse(localStorage.getItem('lifeos_prefs_v6')) || {}).theme;
        if (t === 'light' || (t === 'system' && matchMedia('(prefers-color-scheme: light)').matches)) {
          document.documentElement.classList.add('light');
        }
      } catch (e) {}
    </script>
    <meta name="description" content="Agenda, finanzas, salud y hábitos en una sola app." />
    <!-- Vista previa al compartir el enlace. %SITE_URL% se completa al publicar (ver vite.config.js). -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="LifeOS — Tu día, en un solo vistazo" />
    <meta property="og:description" content="Agenda, dinero y hábitos alrededor de un reloj de 24 horas. Funciona sin conexión." />
    <meta property="og:image" content="%SITE_URL%og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="es_MX" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LifeOS" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
