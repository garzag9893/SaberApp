# Publica la app en GitHub Pages al subir cambios a main.
# Activar una vez: Settings → Pages → Source: "GitHub Actions".
# Para la sincronización opcional, agrega en Settings → Secrets and variables → Actions:
#   VITE_SUPABASE_URL y VITE_SUPABASE_ANON_KEY (la clave anónima es pública por diseño;
#   la seguridad la dan las políticas RLS descritas en el README).
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # No se publica si falla alguna prueba de navegador.
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --trace off
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
