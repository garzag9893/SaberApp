# Pruebas y compilación en cada cambio.
# Nota: GitHub solo ejecuta workflows desde .github/ en la raíz del repositorio,
# así que este archivo se activa cuando LifeOS vive en su propio repositorio.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
